<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The favicon.

    The same pulse trace as the sidebar mark, on the brand's deep ground: the
    dashboard is "Pulse Pro", and a rising-then-settling line is what a month of
    a register actually looks like.

    Drawn for 16px, which is the size that decides everything. The stroke is
    deliberately heavy (6 of 64, so 1.5px at 16) and the trace has only four
    vertices — the wordmark's own six-peak version turns to mush at tab size,
    and a logo nobody can resolve is just a coloured square. The colours are
    sampled from the wordmark: the green carries the line, the blue marks the
    peak, and both clear 4:1 on the ground behind them.
  -->
  <rect width="64" height="64" rx="14" fill="#0e3a4f"/>
  <path
    d="M10 38h7l6-16 9 22 5-12h7"
    fill="none"
    stroke="#87b54b"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="32" cy="44" r="4.5" fill="#22a3dc"/>
</svg>
